name: Build installers (Windows / macOS / Linux)

# Produces native installers for all three platforms.
# - Push a tag like v0.1.0  -> a GitHub Release is created with all installers attached.
# - Or run manually from the Actions tab (workflow_dispatch) to just get build artifacts.
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The push lock's privileged helper, proven on every platform. GitHub's
  # Linux and macOS runners have passwordless sudo and the Windows runner is
  # already elevated with UAC off, so besides the unprivileged test-root mode
  # the suite runs the REAL helper against the runner's real system paths
  # (LOCK_REAL=1) and uninstalls it afterwards. Throwaway VMs; nothing else
  # could prove Linux and Windows without a person at a prompt.
  verify-lock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            git-lfs
      - name: Install git-lfs (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install git-lfs
      - name: Build the sidecars (lock helper, git guard)
        shell: bash
        run: bash scripts/build-lock-helper.sh debug
      # Every crate, on every OS: the Windows-only code (Job Objects, the owner
      # check, the git guard) is only ever compiled here.
      - name: Rust unit tests (workspace)
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --offline || cargo test --manifest-path src-tauri/Cargo.toml --workspace
      - name: Clippy, zero warnings
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Lock suite (test root, no privileges)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash scripts/verify/lock.sh
      - name: Lock suite (REAL helper on the runner's system paths)
        shell: bash
        env:
          LOCK_REAL: "1"
        run: bash scripts/verify/lock.sh
      # identity.sh runs the VS Code extension's own resolver, which is TypeScript.
      - name: Setup Bun
        if: matrix.os != 'windows-latest'
        uses: oven-sh/setup-bun@v2
      - name: Git suites (Changes sandbox, regression, submodules, LFS, sync, tree, stashes)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          bash scripts/verify/sandbox.sh
          bash scripts/verify/regression.sh
          bash scripts/verify/identity.sh
          bash scripts/verify/submodules.sh
          bash scripts/verify/lfs.sh
          bash scripts/verify/sync.sh
          bash scripts/verify/tree.sh
          bash scripts/verify/stash.sh
          bash scripts/verify/ports.sh
      # The same suites under Git Bash. Informational until they have been seen
      # green there: a failure is reported in the log and the step is marked,
      # but does not fail the run.
      - name: Git suites (Windows, Git Bash — informational)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/verify/sandbox.sh
          bash scripts/verify/regression.sh
          bash scripts/verify/submodules.sh
          bash scripts/verify/lfs.sh
          bash scripts/verify/sync.sh
          bash scripts/verify/tree.sh
          bash scripts/verify/stash.sh
      - name: Terminal suite (Windows, cmd.exe — informational)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: bash scripts/verify/console.sh
      # The Ports page's Windows listing has not been seen by a person: the raw
      # PowerShell output is printed so a wrong field name is visible in the
      # log even while the step itself is informational.
      - name: Ports suite (Windows — informational)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: |
          powershell -NoProfile -NonInteractive -Command "Get-NetTCPConnection -State Listen | Select-Object -First 5 LocalAddress,LocalPort,OwningProcess | ConvertTo-Json -Compress"
          bash scripts/verify/ports.sh
      # A real shell in a real pty, through the real git shim. Kept separate so
      # a failure here is attributed to the terminal rather than to git.
      # The shell is pinned per platform: runners set SHELL=/bin/bash even on
      # macOS, so without this zsh — what most Mac users actually get — would
      # never be exercised.
      - name: Terminal suite (Linux, bash)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          SHELL: /bin/bash
        run: bash scripts/verify/console.sh
      - name: Terminal suite (macOS, zsh)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          SHELL: /bin/zsh
        run: bash scripts/verify/console.sh

  # The frontend, on every push: the lockfile installs cleanly (`npm ci`
  # refuses a package-lock.json that disagrees with package.json), the types
  # check, the bundle builds, the IPC contract holds, and the built pages pass
  # the headless browser suites — including the live one against the real
  # backend in a sandbox.
  verify-frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps (frozen lockfile)
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: No deprecated React event types
        run: |
          if grep -rnwE 'FormEvent|FormEventHandler' src; then
            echo "type a form submit as SubmitEvent<HTMLFormElement>"; exit 1
          fi
      - name: Build the frontend
        run: npm run build
      - name: IPC contract (commands.rs ↔ lib.rs ↔ api.ts)
        run: python3 scripts/verify/harness/ipc.py
      - name: Packaging and install docs
        run: python3 scripts/verify/harness/packaging.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf git-lfs
      - name: Build the sidecars (the live harness runs the real backend)
        run: bash scripts/build-lock-helper.sh debug
      # live.mjs builds this offline (CARGO_NET_OFFLINE); the crates have to be fetched first.
      - name: Build the app's test binary
        working-directory: src-tauri
        run: cargo test -p gitswitch --lib --no-run
      - name: Headless browser suites
        working-directory: scripts/verify/harness
        run: |
          npm install
          node ui.mjs
          node history.mjs
          node sweep.mjs
          node live.mjs

  # The VS Code extension, as a file anyone can install: compiled, packed,
  # checked for its entry point, kept as an artifact — and attached to the
  # release on a tag (release-extension below).
  verify-extension:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and test the extension
        run: |
          npx tsc -p .
          node out/test/resolve.test.js
          node out/test/gitrun.test.js
      - name: Carry the release's version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Package (compiles first, through vscode:prepublish)
        run: npm run package
      - name: The package carries the compiled entry point
        run: unzip -l *.vsix | grep -q 'extension/out/extension.js'
      - name: Keep the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: gitswitch-vscode
          path: vscode-extension/*.vsix

  release-extension:
    if: github.ref_type == 'tag'
    needs: [build, verify-extension]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gitswitch-vscode
      - name: Attach the extension to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" *.vsix --clobber --repo "$GITHUB_REPOSITORY"

  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon + Intel via universal target
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux-only system dependencies for Tauri v2
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      # tauri-build refuses to compile the app without the lock-helper sidecar
      # file, so build it (host triple) before the tests. `tauri build` below
      # rebuilds it for the bundle target through beforeBuildCommand.
      - name: Build the sidecars (lock helper, git guard)
        run: bash scripts/build-lock-helper.sh release

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the app (+ create Release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "GitSwitch ${{ github.ref_name }}"
          releaseBody: |
            **macOS, first open:** the app is sealed but not notarized. On macOS 15 and later, open it once and click Done, then System Settings → Privacy & Security → "GitSwitch was blocked…" → Open Anyway → Open. On macOS 14 and earlier, Control-click it in Applications → Open → Open. If macOS says it is damaged: `xattr -dr com.apple.quarantine /Applications/GitSwitch.app`.

            **Windows:** SmartScreen says "Windows protected your PC" for an unsigned installer: More info → Run anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # An unsealed app on Apple Silicon is "damaged" once downloaded; a sealed
      # one only asks to be confirmed. Check the bundle that was shipped.
      - name: The macOS app is sealed
        if: matrix.platform == 'macos-latest'
        run: |
          app="$(ls -d src-tauri/target/*/release/bundle/macos/GitSwitch.app src-tauri/target/release/bundle/macos/GitSwitch.app 2>/dev/null | head -1)"
          test -n "$app" || { echo "no GitSwitch.app was bundled"; exit 1; }
          test -f "$app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'

      # When run manually (no tag), still expose the installers as artifacts
      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: gitswitch-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
          if-no-files-found: ignore
