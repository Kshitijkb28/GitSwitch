[package]
name = "gitswitch-lock-core"
version = "0.1.0"
description = "The pure part of GitSwitch's push lock: job/registry types, validators and config renderers shared by the app and the privileged lock helper"
edition = "2021"
publish = false

[lib]
name = "gitswitch_lock_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
minisign-verify = "0.2"
base64 = "0.22"
