[package]
name = "gitswitch-lock-helper"
version = "0.1.0"
description = "GitSwitch's privileged lock helper: the only code that ever runs with administrator rights, and the remote helper that explains a refused push"
edition = "2021"
publish = false

[[bin]]
name = "gitswitch-lock-helper"
path = "src/main.rs"

[dependencies]
gitswitch-lock-core = { path = "../lock-core" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
] }
